# Fork-only workflow (not present upstream). Builds the self-hosted backend and
# web images for this fork and pushes them to GHCR.
#
# Tags:
#   - main:              only `sha-<full commit SHA>`; `latest` is never moved.
#   - vX.Y.Z-mouse.N:    the version tag, then `latest` is moved to the same
#                        digest only if this is the newest -mouse.N tag, so a
#                        re-run of an older release never rolls it back.
#                        release-fork.yml publishes the runner binaries for the
#                        same tag, so server and runner share one version.
#
# Only linux/amd64 is built. Pull requests never push images.
name: Build Image

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*-mouse.*"
  workflow_dispatch:

permissions: {}

# No workflow-level concurrency: a concurrency group keeps only one pending run
# and cancels the rest, so a re-run of an old commit could displace the newest
# commit's build. Ordering of `latest` is enforced by the tip check below.

jobs:
  build:
    name: build (${{ matrix.image }})
    # A manual run on any other branch would publish unreviewed code.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: multica-backend
            dockerfile: Dockerfile
            title: Multica Backend
            description: Multica self-hosted backend
          - image: multica-web
            dockerfile: Dockerfile.web
            title: Multica Web
            description: Multica self-hosted web frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Validated before anything is pushed. Only reviewed code is released:
      # the tagged commit must be on main.
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mouse\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z-mouse.N; got '$TAG'."
            exit 1
          fi
          # "identical" or "behind": the tagged commit is main or an ancestor.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main ($status)."
            exit 1
          fi

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      # Same build args as upstream release.yml. Main builds keep the
      # Dockerfile's `dev` default so the UI hides the version row instead of
      # showing a non-release string.
      - name: Compute build args
        id: args
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          version=dev
          if [ "$IS_TAG" = "true" ]; then
            version="$REF_NAME"
          fi
          {
            echo "build_args<<EOF"
            if [ "$IMAGE" = "multica-backend" ]; then
              echo "VERSION=$version"
              echo "COMMIT=$GITHUB_SHA"
            else
              echo "REMOTE_API_URL=http://backend:8080"
              echo "NEXT_PUBLIC_APP_VERSION=$version"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          platforms: linux/amd64
          # Keeps the pushed digest an image index, which `imagetools create`
          # copies as-is, so `latest` and `sha-*` share one digest.
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha,scope=build-image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=build-image-${{ matrix.image }}

      - name: Verify LICENSE and NOTICE are in the image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker run --rm --entrypoint sh "$IMAGE_REF" -c 'test -s LICENSE && test -s NOTICE'

      # Checked after the push, immediately before tagging. Only the newest
      # release moves latest; see scripts/fork-release-is-newest.sh.
      - name: Move latest to this build if it is the newest release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' | bash scripts/fork-release-is-newest.sh "$TAG")"
          if [ "$newest" != "true" ]; then
            echo "::notice::$TAG is not the newest release; latest left unchanged"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          got="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::latest points to $got, expected $DIGEST"
            exit 1
          fi

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
